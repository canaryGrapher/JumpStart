name: Release

# Stable channel. "v*" matches every version tag, and the "!v*-*" exclusion
# drops anything carrying a semver pre-release tail (v1.4.0-beta.1, -rc.2,
# -alpha) — those are handled by release-beta.yml. Between the two, every
# v-tag is picked up by exactly one workflow.
on:
  push:
    tags:
      - "v*"
      - "!v*-*"

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      tag: ${{ github.ref_name }}
    # Reusable workflows do not receive caller secrets unless inherited.
    # Without this, DESKTOP_GA_API_SECRET is empty in the binary and the
    # analytics client is a no-op even though GAMeasurementID is stamped
    # from a repo Variable (vars are visible; secrets are not).
    secrets: inherit

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
