name: Build

# Reusable build matrix, called by release.yml (stable tags) and
# release-beta.yml (pre-release tags). Both callers pass the tag they were
# triggered by; nothing here decides which channel a build belongs to.
on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to build and stamp into the binaries (e.g. v1.4.0 or v1.4.0-beta.1)."
        required: true
        type: string

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
          - os: windows-latest
            platform: windows/amd64
          - os: macos-latest
            platform: darwin/universal
    runs-on: ${{ matrix.os }}
    # Desktop analytics: GA4 Measurement Protocol credentials stamped into the
    # Go binary (not the frontend). Empty values disable analytics (local/fork).
    #   DESKTOP_GA_MEASUREMENT_ID — repo Variable (G-…)
    #   DESKTOP_GA_API_SECRET     — repo Secret (MP API secret)
    env:
      DESKTOP_GA_MEASUREMENT_ID: ${{ vars.DESKTOP_GA_MEASUREMENT_ID }}
      DESKTOP_GA_API_SECRET: ${{ secrets.DESKTOP_GA_API_SECRET }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      # The patch date shown in Settings > About. Resolved once per job so all
      # three platform builds of a tag agree, and taken in UTC so it does not
      # drift with the runner's locale.
      - name: Resolve build date
        shell: bash
        run: echo "BUILD_DATE=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      # -ldflags injects the release tag into main.Version so the in-app
      # version (About window, updater) always matches the tag. parse() in the
      # updater trims the leading "v", and GetAppVersion trims it for display.
      # Pre-release tags carry their suffix through, which is exactly what the
      # updater's beta-channel comparison reads. main.BuildDate rides along and
      # is what About shows as the patch date.
      #
      # The same mechanism carries GA4 MP credentials into
      # main.GAMeasurementID / main.GAAPISecret. Both default to empty, which
      # makes analytics an unconditional no-op in local and fork builds.
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: >
          wails build -platform ${{ matrix.platform }} -tags webkit2_41
          -ldflags "-X main.Version=${{ inputs.tag }}
          -X main.BuildDate=$BUILD_DATE
          -X main.GAMeasurementID=$DESKTOP_GA_MEASUREMENT_ID
          -X main.GAAPISecret=$DESKTOP_GA_API_SECRET"

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: >
          wails build -platform ${{ matrix.platform }}
          -ldflags "-X main.Version=${{ inputs.tag }}
          -X main.BuildDate=$BUILD_DATE
          -X main.GAMeasurementID=$DESKTOP_GA_MEASUREMENT_ID
          -X main.GAAPISecret=$DESKTOP_GA_API_SECRET"

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: >
          wails build -platform ${{ matrix.platform }}
          -ldflags "-X main.Version=${{ inputs.tag }}
          -X main.BuildDate=$BUILD_DATE
          -X main.GAMeasurementID=$DESKTOP_GA_MEASUREMENT_ID
          -X main.GAAPISecret=$DESKTOP_GA_API_SECRET"

      # Wails names outputs from wails.json "outputfilename" (JumpStart):
      # build/bin/JumpStart (Linux), JumpStart.exe (Windows), JumpStart.app (macOS).
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf jumpstart_${TAG}_linux-amd64.tar.gz -C build/bin JumpStart

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path build/bin/JumpStart.exe -DestinationPath jumpstart_${env:TAG}_windows-amd64.zip

      # Stamp the real release version into the bundle. Wails fills the
      # Info.plist from wails.json (defaults to 1.0.0), so overwrite it with the
      # tag (minus the leading "v") before signing, or Finder/About show 1.0.0.
      # Must run BEFORE codesign so the signature covers the edited plist.
      - name: Stamp version into Info.plist (macOS)
        if: runner.os == 'macOS'
        run: |
          VERSION="${TAG#v}"
          PLIST="build/bin/JumpStart.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION" "$PLIST"
          echo "Info.plist version: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")"

      # Ad-hoc sign so macOS shows the recoverable "Open Anyway" warning
      # instead of the "app is damaged / Move to Bin" dead-end. This is free
      # (no Apple Developer account); users still approve once via
      # System Settings > Privacy & Security > Open Anyway.
      - name: Ad-hoc code sign (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --deep --force --options runtime --sign - build/bin/JumpStart.app
          codesign --verify --deep --strict --verbose=2 build/bin/JumpStart.app

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent build/bin/JumpStart.app jumpstart_${TAG}_macos-universal.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jumpstart-${{ runner.os }}
          path: |
            jumpstart_*.tar.gz
            jumpstart_*.zip
          if-no-files-found: error
